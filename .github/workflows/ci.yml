name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Lint, validate, test, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint
        run: npm run lint

      - name: Validate data fixtures
        run: npm run validate:data

      - name: Test
        run: npm run test

      - name: Smoke
        run: npm run smoke

      - name: Full check
        run: npm run check
